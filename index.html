<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opendial: an open catalogue of real radio stations</title>
<meta name="description" content="An open catalogue of real FM radio stations, city by city, with each internet stream checked on a schedule.">
<style>
  /* The top bar takes the documentation viewer's own colours, in its light and dark modes. */
  :root { --bar: 48px; --scalar-custom-header-height: 48px; }
  html, body { margin: 0; height: 100%; }
  body { --bar-bg: #fff; --bar-c1: #1b1b1b; --bar-c2: #707070; --bar-hover: #f6f6f6; --bar-border: #dfdfdf; }
  body.dark-mode { --bar-bg: #0f0f0f; --bar-c1: #e7e7e7; --bar-c2: #a4a4a4; --bar-hover: #1a1a1a; --bar-border: #2d2d2d; }
  .bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 1000; display: flex; align-items: center;
         gap: 2px; padding: 0 12px 0 20px; box-sizing: border-box;
         font: 500 14px/1 "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         background: var(--bar-bg); color: var(--bar-c1); border-bottom: .5px solid var(--bar-border); }
  .bar strong { font-size: 16px; font-weight: 600; margin-right: 16px; }
  .bar button, .bar a { font: inherit; color: var(--bar-c2); background: none; border: 0; height: 32px; padding: 0 10px;
                        border-radius: 3px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .bar button:hover, .bar a:hover { background: var(--bar-hover); color: var(--bar-c1); }
  .bar button[aria-pressed="true"] { background: var(--bar-hover); color: var(--bar-c1); }
  .bar .push { margin-left: auto; }
  #docs { padding-top: var(--bar); }
  #listen { position: fixed; inset: var(--bar) 0 0 0; width: 100%; height: calc(100% - var(--bar)); border: 0; background: var(--bar-bg); }
  [hidden] { display: none !important; }
  noscript { display: block; padding: 80px 24px; font: 16px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<header class="bar">
  <strong>opendial</strong>
  <button id="tabDocs" type="button" aria-pressed="true">Documentation</button>
  <button id="tabListen" type="button" aria-pressed="false">Listening test</button>
  <a class="push" href="https://github.com/yaasiin-ayeva/opendial">GitHub</a>
</header>

<main id="docs"><div id="app"></div></main>
<iframe id="listen" title="Listening test" hidden></iframe>

<noscript>opendial's documentation needs JavaScript. The same content is in the
<a href="https://github.com/yaasiin-ayeva/opendial#readme">README</a>, and the catalogue is plain JSON:
<a href="public/index.json">public/index.json</a>.</noscript>

<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<script>
  // Two views on one page: the documentation (Scalar, from openapi.yaml) and the listening test
  // (tools/listen.html in a frame, loaded on first use). ?view=listen opens the test directly.
  var docs = document.getElementById('docs'), frame = document.getElementById('listen');
  var tabDocs = document.getElementById('tabDocs'), tabListen = document.getElementById('tabListen');
  function show(view, push) {
    var listen = view === 'listen';
    if (listen && !frame.getAttribute('src')) frame.setAttribute('src', 'tools/listen.html');
    docs.hidden = listen; frame.hidden = !listen;
    tabDocs.setAttribute('aria-pressed', String(!listen)); tabListen.setAttribute('aria-pressed', String(listen));
    if (push) history.pushState(null, '', listen ? '?view=listen' : location.pathname);
  }
  function current() { return new URLSearchParams(location.search).get('view') === 'listen' ? 'listen' : 'docs'; }
  tabDocs.addEventListener('click', function () { show('docs', true); });
  tabListen.addEventListener('click', function () { show('listen', true); });
  window.addEventListener('popstate', function () { show(current(), false); });
  // Links to ?view=listen inside the documentation switch the view without a reload.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (a && /[?&]view=listen/.test(a.getAttribute('href'))) { e.preventDefault(); show('listen', true); }
  });
  show(current(), false);

  if (window.Scalar) {
    Scalar.createApiReference('#app', {
      url: 'openapi.yaml',
      hideClientButton: true,
      metaData: { title: 'opendial: an open catalogue of real radio stations' }
    });
  } else {
    document.getElementById('app').innerHTML = '<p style="padding:24px;font:16px/1.5 system-ui,sans-serif">The documentation viewer could not be loaded. See the <a href="https://github.com/yaasiin-ayeva/opendial#readme">README</a> or <a href="openapi.yaml">openapi.yaml</a>.</p>';
  }
</script>
</body>
</html>
