openapi: 3.1.0
info:
  title: opendial
  version: "0.1"
  summary: An open catalogue of real FM radio stations, city by city, with each stream checked on a schedule.
  description: |
    opendial keeps a hand-edited list of the FM stations of a city, tests the internet stream of each
    one on a schedule, and publishes the stations a web page can play now. It covers
    **Accra** (Ghana), **Cotonou** (Benin) and **Lomé** (Togo); other cities are added as new lists.

    opendial does **not** relay, record or store audio. An app that uses it plays each station's own
    stream directly in the listener's browser.

    ## How to use it

    1. Read `public/index.json` to see which cities are published.
    2. Read `public/{country}/{city}.json` for the stations of one city, sorted by frequency.
    3. Play `streams[0].url` in an `<audio>` element (with hls.js when `hls` is true). If it fails,
       try the next stream, then the next station.

    The files are static JSON served by GitHub Pages: no key, no account, no rate limit of our own.
    There is nothing to send; every operation here is a `GET`.

    ## What "published" means

    A station is published when one of its streams answered the last check with audio, over HTTPS.

    | Field | Meaning |
    | --- | --- |
    | `hls` | The stream is an HLS playlist: use hls.js, except in Safari |
    | `cors` | The server allows the checking origin to read the audio. Route audio through Web Audio (filters, visualisers) only when this is true; plain playback works without it |
    | `permission` | Whether the station has agreed to be listed in an app: `not-asked`, `asked`, `granted`, `refused` |
    | `checked_at` | When the city was last checked (UTC). A stream can fail between two checks: treat the catalogue as a hint, not a promise |

    ## Listening test

    Only a real browser can prove that a stream plays from a web page. The
    [listening test](?view=listen) plays every stream of a list in turn, notes whether sound started
    and how fast, tests CORS, and exports the results. Use the **Listening test** button at the top
    of this page.

    ## State of the data

    Accra is the first city: 18 stations. On 15 November 2026 the listening test played 14 of them in
    Chrome; 13 of those also allow Web Audio (`cors`). Class FM, GBC Uniiq FM, Okay FM and Oman FM did
    not load and still need a working address. Lomé (13 stations) and Cotonou (14) were added the
    same day; 11 of their stations have a stream address, and 9 of those played in the listening test. Nobody has yet listened to confirm that each stream is
    the station it claims to be. The published catalogue only ever contains streams that passed the
    automatic check.

    ## Adding a city

    Create `stations/{country}/{city}.json` on the model of `stations/gh/accra.json`, add it to
    `stations/index.json`, and open a pull request. `{country}` is the lower-case ISO 3166 two-letter code, `{city}` a
    lower-case name with hyphens. The scheduled check picks the new list up by itself. Details are in
    [CONTRIBUTING.md](https://github.com/yaasiin-ayeva/opendial/blob/main/CONTRIBUTING.md).

    ## Rights

    The stations belong to their broadcasters. opendial lists public stream addresses and gives no
    right to use a station's name or audio; `permission` records what each station has answered.
  contact:
    name: opendial on GitHub
    url: https://github.com/yaasiin-ayeva/opendial
servers:
  - url: https://yaasiin-ayeva.github.io/opendial
    description: GitHub Pages
tags:
  - name: Catalogue
    description: Generated by the scheduled check. This is what an app reads.
  - name: Source lists
    description: Edited by hand. Useful to see every station of a city, including the ones whose stream is down.
paths:
  /public/index.json:
    get:
      tags: [Catalogue]
      operationId: listCities
      summary: List the published cities
      description: One entry per city, with the path of its catalogue and the result of its last check.
      responses:
        "200":
          description: The index of cities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Index"
              example:
                cities:
                  - country: GH
                    country_name: Ghana
                    city: Accra
                    path: gh/accra.json
                    checked_at: "2026-11-15T13:30:00+00:00"
                    listed: 18
                    published: 12
        "404":
          description: The scheduled check has not run yet
  /public/{country}/{city}.json:
    get:
      tags: [Catalogue]
      operationId: getCity
      summary: Get the playable stations of a city
      description: The stations whose stream passed the last check, sorted by frequency.
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/city"
      responses:
        "200":
          description: The city's catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
              example:
                country: GH
                city: Accra
                checked_at: "2026-11-15T13:30:00+00:00"
                stations:
                  - id: joy-fm
                    name: Joy FM
                    frequency_mhz: 99.7
                    language: en
                    format: news, talk, music
                    permission: not-asked
                    streams:
                      - url: https://example.org/joyfm
                        hls: false
                        cors: true
                        content_type: audio/mpeg
                        bitrate_kbps: 128
        "404":
          description: No such city, or its first check has not run yet
  /stations/index.json:
    get:
      tags: [Source lists]
      operationId: listSourceLists
      summary: List the hand-edited lists
      description: One entry per city that has a list, whether or not it is published yet.
      responses:
        "200":
          description: The lists
          content:
            application/json:
              example:
                lists:
                  - path: gh/accra.json
                    country: GH
                    country_name: Ghana
                    city: Accra
  /stations/{country}/{city}.json:
    get:
      tags: [Source lists]
      operationId: getCitySource
      summary: Get the hand-edited list of a city
      description: Every station of the city with its stream addresses, where each value was read, and whether it has been verified. Not filtered by the check.
      parameters:
        - $ref: "#/components/parameters/country"
        - $ref: "#/components/parameters/city"
      responses:
        "200":
          description: The source list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "404":
          description: No such city
components:
  parameters:
    country:
      name: country
      in: path
      required: true
      description: Lower-case ISO 3166 two-letter country code
      schema: { type: string, pattern: "^[a-z]{2}$" }
      example: gh
    city:
      name: city
      in: path
      required: true
      description: Lower-case city name, with hyphens
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
      example: accra
  schemas:
    Index:
      type: object
      required: [cities]
      properties:
        cities:
          type: array
          items:
            type: object
            required: [country, city, path, checked_at, listed, published]
            properties:
              country: { type: string, description: ISO 3166 two-letter code, example: GH }
              country_name: { type: string, example: Ghana }
              city: { type: string, example: Accra }
              path: { type: string, description: Path of the city's catalogue under public/, example: gh/accra.json }
              checked_at: { type: string, format: date-time }
              listed: { type: integer, description: Stations in the source list }
              published: { type: integer, description: Stations whose stream passed the last check }
    City:
      type: object
      required: [checked_at, stations]
      properties:
        country: { type: string, example: GH }
        city: { type: string, example: Accra }
        checked_at: { type: string, format: date-time }
        stations:
          type: array
          items: { $ref: "#/components/schemas/Station" }
    Station:
      type: object
      required: [id, name, streams]
      properties:
        id: { type: string, description: Stable identifier within the city, example: joy-fm }
        name: { type: string, example: Joy FM }
        frequency_mhz: { type: [number, "null"], example: 99.7 }
        language: { type: [string, "null"], description: Main language of the station, example: en }
        format: { type: [string, "null"], example: "news, talk, music" }
        permission:
          type: string
          enum: [not-asked, asked, granted, refused]
        streams:
          type: array
          description: Streams that passed the last check, in order of preference
          items: { $ref: "#/components/schemas/Stream" }
    Stream:
      type: object
      required: [url, hls, cors]
      properties:
        url: { type: string, format: uri }
        hls: { type: boolean }
        cors: { type: boolean }
        content_type: { type: string, example: audio/mpeg }
        bitrate_kbps: { type: [integer, "null"], example: 128 }
    SourceList:
      type: object
      required: [country, city, stations]
      properties:
        country: { type: string, example: GH }
        country_name: { type: string, example: Ghana }
        city: { type: string, example: Accra }
        about: { type: string }
        stations:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              frequency_mhz: { type: [number, "null"] }
              language: { type: string }
              format: { type: string }
              homepage: { type: string }
              stream: { type: string, description: The station's main stream address; may be empty }
              backup_streams: { type: array, items: { type: string } }
              permission: { type: string, enum: [not-asked, asked, granted, refused] }
              sources: { type: array, items: { type: string }, description: Pages where the values were read }
              verified: { type: string, enum: [unverified, played, heard, checked], description: "unverified: never played. played: a browser played it. heard: a person confirmed the station. checked: passes the scheduled check" }
              last_test: { type: object, description: The latest listening test of the main stream }
              note: { type: string }
