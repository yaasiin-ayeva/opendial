name: tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['public/**', 'log/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checker and the lists
        run: python3 -m unittest discover -s tests -v
