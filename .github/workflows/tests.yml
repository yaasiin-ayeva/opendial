name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The station list is valid JSON
        run: python3 -c "import glob, json; [json.load(open(f, encoding='utf-8')) for f in glob.glob('stations/*/*.json')]"
      - name: Test the checker against a local server
        run: python3 -m unittest discover -s tests -v
